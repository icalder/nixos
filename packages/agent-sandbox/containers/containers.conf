# containers.conf — libpod/podman engine config for the agent sandbox.
# Selected with CONTAINERS_CONF; see the "container images" block in sandbox.sh.
#
# cgroup_manager = "disabled": the alternatives both hang or fail in here.
# "systemd" needs a D-Bus session bus and /run/systemd/system (invisible), and
# "cgroupfs" needs to write /sys/fs/cgroup, which is bound read-only (podman
# only needs statfs to succeed on it, which is why it is bound at all).
# A container would need a real cgroup anyway, and containers cannot run in the
# sandbox — see the pull/run/build limitation in README.md.
#
# events_logger = "file": the default "journald" needs the host's journal socket
# in $XDG_RUNTIME_DIR, which is a private tmpfs here.
[engine]
cgroup_manager = "disabled"
events_logger = "file"
