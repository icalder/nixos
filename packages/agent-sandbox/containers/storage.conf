# storage.conf — containers/storage config for the agent sandbox.
# Bound into the sandbox and selected with CONTAINERS_STORAGE_CONF; see the
# "container images" block in sandbox.sh for why every value here is forced.
#
# vfs: the only driver that works in the sandbox. The sandboxed process has no
# capabilities in any user namespace, so it cannot mount anything — overlay and
# fuse-overlayfs both mount a layer, vfs just copies directories.
#
# graphroot/runroot on the sandbox's private /tmp (tmpfs): the store is
# per-session and nothing is written to the host. Deliberately NOT the host's
# rootless store (~/.local/share/containers/storage): that one uses the subuid
# range the sandbox does not have, so its layer files are unreadable in here.
# Override CONTAINERS_STORAGE_CONF with a copy of this file pointing graphroot
# at a bound host directory to keep images between sessions.
[storage]
driver = "vfs"
graphroot = "/tmp/containers/storage"
runroot = "/tmp/containers/run"
