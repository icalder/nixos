# Canonical layout for model `cmd` commands — follow this when adding models.
#
# `cmd` is a plain string that llama-swap tokenizes on whitespace, so line
# breaks are purely cosmetic. Wrap new commands as follows, top to bottom:
#
#   cmd: <path-to-llama-server.exe>
#     --model <gguf-path>
#     --mmproj <mmproj-path>            # if any
#     --port ${PORT} [--device GPU] -np N --flash-attn on --ctx-size N [--threads N] --no-ui
#     [--embeddings | --reranking] [--lazy-mode X] [--load-mode X] [-lzm on]  # mode/load, if any
#     --temp X [--top-p X] [--top-k X] [--presence-penalty X] [--min-p X]     # tuning: own line, nothing else
#     --spec-type T [--spec-draft-device X] [--spec-draft-n-max N]            # if any
#     --spec-draft-model <gguf-path>
#
# Rules:
# - a flag and its value always stay on the same line
# - lines break at flag boundaries; keep lines <= 100 chars where possible
#   (a single unbreakable model path may exceed this)
# - omit lines whose flag group is absent; keep the order of the rest

models:
  bge-m3:
    cmd: C:/Users/iainc/llama-cpp/llama-server.exe
      --model F:/llama-models/ggml-org/bge-m3-Q8_0-GGUF/bge-m3-q8_0.gguf
      --embeddings --ubatch-size 2048
      --port ${PORT} --device CUDA0 -np 2 --flash-attn on --ctx-size 8192 --no-ui
